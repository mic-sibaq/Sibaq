<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Student Profile | SIBAQ National Arts Fest</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef2ff,#f8fafc)}.card{width:min(100%,650px);background:white;border:1px solid #dfe5ef;border-radius:24px;box-shadow:0 20px 60px #17203318;overflow:hidden}.head{padding:28px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white}.kicker{font-size:12px;letter-spacing:2px;font-weight:800;opacity:.85;text-transform:uppercase}h1{margin:10px 0 4px;font-size:clamp(25px,6vw,36px);overflow-wrap:anywhere}.sub{opacity:.9}.body{padding:22px}.row{padding:15px 0;border-bottom:1px solid #e7ebf2}.row:last-child{border:0}.label{font-size:12px;color:#667085;text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:5px}.value{font-size:18px;font-weight:700;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5}.foot{text-align:center;color:#667085;font-size:12px;padding:0 22px 22px}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:16px;border-radius:12px;line-height:1.5}.updated{font-size:12px;color:#667085;margin-top:18px}
</style></head><body>
<main class="card" id="profile" hidden><header class="head"><div class="kicker">SIBAQ • National Arts Fest</div><h1 id="studentName">Student Profile</h1><div class="sub">Official student information</div></header><section class="body">
<div class="row"><div class="label">Admission Number</div><div class="value" id="admissionValue"></div></div>
<div class="row"><div class="label">Name</div><div class="value" id="nameValue"></div></div>
<div class="row"><div class="label">Mentor</div><div class="value" id="mentorValue"></div></div>
<div class="row"><div class="label">Programs</div><div class="value" id="programsValue"></div></div>
<div class="row"><div class="label">Program Codes</div><div class="value" id="codesValue"></div></div>
<div class="updated" id="updatedValue"></div></section><footer class="foot">SIBAQ National Arts Fest • If any information is incorrect, please contact the Control Room.</footer></main>
<div id="message" class="error" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(async function(){const message=document.getElementById('message');function fail(t){message.hidden=false;message.textContent=t;}const cfg=window.SIBAQ_SUPABASE_CONFIG||{};if(!window.supabase||!cfg.url||!cfg.anonKey||cfg.url.includes('YOUR_')){fail('The student profile database is not configured yet. Please contact the SIBAQ Control Room.');return;}const id=new URLSearchParams(location.search).get('id');if(!id){fail('This QR link has no admission number. Please contact the Control Room.');return;}try{const db=window.supabase.createClient(cfg.url,cfg.anonKey);const {data,error}=await db.from('student_profiles').select('admission_no,name,mentor,programs,program_codes,updated_at').eq('admission_no',id).maybeSingle();if(error)throw error;if(!data){fail('No profile was found for admission number '+id+'. Please ask the Control Room to upload the student list.');return;}const put=(id,value)=>document.getElementById(id).textContent=value||'Not provided';put('admissionValue',data.admission_no);put('nameValue',data.name);put('mentorValue',data.mentor);put('programsValue',(data.programs||[]).join(String.fromCharCode(10)));put('codesValue',(data.program_codes||[]).join(String.fromCharCode(10)));document.getElementById('studentName').textContent=data.name||'Student Profile';document.getElementById('updatedValue').textContent=data.updated_at?'Last updated: '+new Date(data.updated_at).toLocaleString():'Profile information';document.getElementById('profile').hidden=false;document.title=(data.name||'Student Profile')+' | SIBAQ National Arts Fest';}catch(e){fail('Could not load this profile. Please check your internet connection or contact the Control Room. Details: '+(e.message||'database error'));}})();
</script></body></html>
